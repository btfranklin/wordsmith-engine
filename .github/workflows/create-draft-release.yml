name: Create Draft Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    python-validation:
        uses: ./.github/workflows/python-package.yml

    typescript-validation:
        uses: ./.github/workflows/typescript-package.yml

    gdscript-validation:
        uses: ./.github/workflows/gdscript-package.yml

    draft-release:
        needs: [python-validation, typescript-validation, gdscript-validation]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
            - name: Create draft release with generated notes
              uses: btfranklin/release-notes-scribe@v0
              with:
                  openai_api_key: ${{ secrets.OPENAI_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  include_github_generated_notes: "true"
                  draft: "true"
                  create_release: "true"
            - uses: actions/download-artifact@v8
              with:
                  name: godot-distribution
                  path: godot-dist
            - name: Attach verified Godot add-on to the draft
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" "godot-dist/wordsmith-engine-godot-${GITHUB_REF_NAME#v}.zip"
