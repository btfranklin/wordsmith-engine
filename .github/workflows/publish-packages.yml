name: Publish packages

on:
    release:
        types: [published]

permissions:
    contents: read

env:
    RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
    build-packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.release.tag_name }}
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
            - name: Build Python artifacts
              working-directory: packages/python
              run: |
                  [[ "$RELEASE_TAG" == v* ]]
                  pdm build --dest release-dist
                  test -f "release-dist/wordsmith_engine-${RELEASE_TAG#v}-py3-none-any.whl"
                  test -f "release-dist/wordsmith_engine-${RELEASE_TAG#v}.tar.gz"
            - name: Set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: packages/typescript/package-lock.json
            - name: Install TypeScript build dependencies
              working-directory: packages/typescript
              run: npm ci
            - name: Build npm artifact
              working-directory: packages/typescript
              run: |
                  npm run verify:release-tag
                  mkdir -p release-dist
                  npm pack --pack-destination release-dist
                  test -f "release-dist/wordsmith-engine-${RELEASE_TAG#v}.tgz"
            - name: Upload Python artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: python-distributions
                  path: packages/python/release-dist/*
                  if-no-files-found: error
            - name: Upload npm artifact
              uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: packages/typescript/release-dist/*.tgz
                  if-no-files-found: error

    publish-python:
        needs: build-packages
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download Python artifacts
              uses: actions/download-artifact@v8
              with:
                  name: python-distributions
                  path: python-distributions
            - name: Publish Python artifacts with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: python-distributions/

    publish-typescript:
        needs: build-packages
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Set up Node.js 24 for Trusted Publishing
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Verify npm supports Trusted Publishing
              run: |
                  npm_version="$(npm --version)"
                  echo "npm $npm_version"
                  node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
            - name: Download npm artifact
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: npm-package
            - name: Publish npm artifact with Trusted Publishing
              run: |
                  package="npm-package/wordsmith-engine-${RELEASE_TAG#v}.tgz"
                  test -f "$package"
                  npm publish "./$package" --provenance --access public
