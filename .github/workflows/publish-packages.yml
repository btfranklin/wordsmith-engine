name: Publish packages

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing release tag to validate and optionally publish
                required: true
                type: string
            artifact_run_id:
                description: Prior validated run ID to reuse without rebuilding
                required: false
                type: string
            publish_python:
                description: Publish the validated Python artifacts to PyPI
                required: true
                default: false
                type: boolean
            publish_typescript:
                description: Publish the validated TypeScript artifact to npm
                required: true
                default: false
                type: boolean

permissions:
    actions: read
    contents: read

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
    python-preflight:
        if: inputs.artifact_run_id == ''
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ env.RELEASE_TAG }}
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Validate Python package
              working-directory: packages/python
              run: |
                  pdm run check-assets
                  pdm run lint
                  pdm run test
            - name: Build exact Python artifacts
              working-directory: packages/python
              run: pdm build --dest release-dist
            - name: Verify Python artifacts and release tag
              working-directory: packages/python
              run: |
                  [[ "$RELEASE_TAG" == v* ]]
                  pdm run verify-package \
                      --dist release-dist \
                      --expected-version "${RELEASE_TAG#v}"
            - name: Upload exact Python artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: python-distributions
                  path: packages/python/release-dist/*
                  if-no-files-found: error

    typescript-preflight:
        if: inputs.artifact_run_id == ''
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: packages/typescript

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - name: Set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: packages/typescript/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Validate TypeScript package
              run: npm run check:core
            - name: Verify release tag
              run: npm run verify:release-tag
            - name: Build and verify exact npm artifact
              run: npm run verify:package -- --pack-destination release-dist
            - name: Upload exact npm artifact
              uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: packages/typescript/release-dist/*.tgz
                  if-no-files-found: error

    recovery-preflight:
        if: inputs.artifact_run_id != ''
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ env.RELEASE_TAG }}
            - name: Verify artifact run provenance
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
              run: |
                  expected_sha="$(git rev-parse HEAD)"
                  run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
                  test "$(jq -r '.name' <<<"$run_json")" = "Publish packages"
                  test "$(jq -r '.head_sha' <<<"$run_json")" = "$expected_sha"
                  jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs?per_page=100")"
                  test "$(jq '[.jobs[] | select(.name == "python-preflight" and .conclusion == "success")] | length' <<<"$jobs_json")" -eq 1
                  test "$(jq '[.jobs[] | select(.name == "typescript-preflight" and .conclusion == "success")] | length' <<<"$jobs_json")" -eq 1
            - name: Download Python artifacts
              uses: actions/download-artifact@v8
              with:
                  name: python-distributions
                  path: recovery/python-distributions
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.artifact_run_id }}
            - name: Download npm artifact
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: recovery/npm-package
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.artifact_run_id }}
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install Python verification dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Reverify exact Python artifacts
              working-directory: packages/python
              run: |
                  pdm run verify-package \
                      --dist ../../recovery/python-distributions \
                      --expected-version "${RELEASE_TAG#v}"
            - name: Set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: packages/typescript/package-lock.json
            - name: Install TypeScript verification dependencies
              working-directory: packages/typescript
              run: npm ci
            - name: Reverify exact npm artifact
              working-directory: packages/typescript
              run: |
                  node scripts/verify-package.mjs \
                      --package "../../recovery/npm-package/wordsmith-engine-${RELEASE_TAG#v}.tgz"

    publish-python:
        if: >-
            always() &&
            (github.event_name == 'release' || inputs.publish_python) &&
            (
              (
                needs.python-preflight.result == 'success' &&
                needs.typescript-preflight.result == 'success'
              ) ||
              needs.recovery-preflight.result == 'success'
            )
        needs: [python-preflight, typescript-preflight, recovery-preflight]
        runs-on: ubuntu-latest
        environment: release
        permissions:
            actions: read
            contents: read
            id-token: write

        steps:
            - name: Download exact Python artifacts
              uses: actions/download-artifact@v8
              with:
                  name: python-distributions
                  path: python-distributions
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.artifact_run_id || github.run_id }}
            - name: Verify reused artifact names
              run: |
                  test -f "python-distributions/wordsmith_engine-${RELEASE_TAG#v}-py3-none-any.whl"
                  test -f "python-distributions/wordsmith_engine-${RELEASE_TAG#v}.tar.gz"
            - name: Publish Python artifacts with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: python-distributions/

    publish-typescript:
        if: >-
            always() &&
            (github.event_name == 'release' || inputs.publish_typescript) &&
            (
              (
                needs.python-preflight.result == 'success' &&
                needs.typescript-preflight.result == 'success'
              ) ||
              needs.recovery-preflight.result == 'success'
            )
        needs: [python-preflight, typescript-preflight, recovery-preflight]
        runs-on: ubuntu-latest
        environment: release
        permissions:
            actions: read
            contents: read
            id-token: write

        steps:
            - name: Set up Node.js 24 for Trusted Publishing
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Verify npm supports Trusted Publishing
              run: |
                  npm_version="$(npm --version)"
                  echo "npm $npm_version"
                  node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
            - name: Download exact npm artifact
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: npm-package
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.artifact_run_id || github.run_id }}
            - name: Publish npm artifact with Trusted Publishing
              run: |
                  package="npm-package/wordsmith-engine-${RELEASE_TAG#v}.tgz"
                  test -f "$package"
                  npm publish "./$package" --provenance --access public
