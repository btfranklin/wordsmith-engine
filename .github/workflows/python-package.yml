name: Python package

on:
    workflow_call:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install documentation checker
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p "$RUNNER_TEMP/perfect-doc"
                  gh release download --repo btfranklin/perfect-doc \
                      --pattern '*x86_64-unknown-linux-gnu.tar.gz' \
                      --pattern SHA256SUMS --dir "$RUNNER_TEMP/perfect-doc"
                  cd "$RUNNER_TEMP/perfect-doc"
                  sha256sum --check --ignore-missing SHA256SUMS
                  tar -xzf ./*.tar.gz --strip-components=1
                  echo "$RUNNER_TEMP/perfect-doc" >> "$GITHUB_PATH"
            - name: Check documentation
              run: >-
                  perfect-doc --no-banner check --offline
                  README.md AGENTS.md spec docs
                  packages/python/README.md packages/typescript/README.md

    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Validate Python package
              working-directory: packages/python
              run: pdm run check-core

    package:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Build package
              working-directory: packages/python
              run: pdm build --dest package-dist
            - name: Verify package
              working-directory: packages/python
              run: |
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      pdm run verify-package --dist package-dist --expected-version "${GITHUB_REF_NAME#v}"
                  else
                      pdm run verify-package --dist package-dist
                  fi
