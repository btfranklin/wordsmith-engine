name: Python package

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Verify canonical assets
              working-directory: packages/python
              run: pdm run check-assets
            - name: Lint with Ruff
              working-directory: packages/python
              run: pdm run lint
            - name: Test with pytest
              working-directory: packages/python
              run: pdm run test

    package:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: packages/python/pdm.lock
            - name: Install dependencies
              working-directory: packages/python
              run: pdm install --group dev
            - name: Build package
              working-directory: packages/python
              run: pdm build --dest package-dist
            - name: Verify package
              working-directory: packages/python
              run: pdm run verify-package --dist package-dist
